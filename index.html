<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Mission War - 작전 통제 본부</title>
  
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --bg-dark: #05060a;
      --panel-bg: rgba(11, 14, 25, 0.78);
      --panel-border: rgba(255, 255, 255, 0.07);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      
      --color-team1: #ff3366;
      --color-team2: #33ccff;
      --color-primary: #8b5cf6;
      
      --glow-team1: 0 0 25px rgba(255, 51, 102, 0.5);
      --glow-team2: 0 0 25px rgba(51, 204, 255, 0.5);
    }
    
    html, body {
      height: 100vh;
      overflow: hidden;
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* Background Canvas */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    
    .glass-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    
    .landing-container {
      width: 100%;
      max-width: 900px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
    }
    
    .brand-section {
      text-align: center;
    }
    
    .brand-icon {
      font-size: 3rem;
      background: linear-gradient(135deg, var(--color-team1), var(--color-team2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.4));
      animation: pulse 2s infinite ease-in-out;
    }
    
    .title-neon {
      text-transform: uppercase;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--color-team1), var(--color-team2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(139, 92, 246, 0.35);
    }
    
    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }
    
    .cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      width: 100%;
    }
    
    .team-card {
      padding: 35px 25px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
      overflow: hidden;
    }
    
    .team-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    
    /* Team 1 Style */
    .team-card.t1:hover {
      transform: translateY(-8px);
      box-shadow: var(--glow-team1);
    }
    .team-card.t1:hover::before {
      border-color: var(--color-team1);
    }
    .team-card.t1 .card-icon {
      color: var(--color-team1);
      text-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
    }
    
    /* Team 2 Style */
    .team-card.t2:hover {
      transform: translateY(-8px);
      box-shadow: var(--glow-team2);
    }
    .team-card.t2:hover::before {
      border-color: var(--color-team2);
    }
    .team-card.t2 .card-icon {
      color: var(--color-team2);
      text-shadow: 0 0 15px rgba(51, 204, 255, 0.4);
    }
    
    .card-icon {
      font-size: 3.5rem;
      margin-bottom: 8px;
      transition: transform 0.3s ease;
    }
    
    .team-card:hover .card-icon {
      transform: scale(1.1) rotate(5deg);
    }
    
    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }
    
    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      height: 40px;
    }
    
    .member-badge {
      font-size: 0.72rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--text-muted);
    }
    
    .enter-btn {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    
    .t1 .enter-btn {
      background: linear-gradient(135deg, var(--color-team1), #ff6699);
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.25);
    }
    .t1:hover .enter-btn {
      box-shadow: 0 4px 20px rgba(255, 51, 102, 0.5);
      filter: brightness(1.1);
    }
    
    .t2 .enter-btn {
      background: linear-gradient(135deg, var(--color-team2), #66d9ff);
      box-shadow: 0 4px 15px rgba(51, 204, 255, 0.25);
    }
    .t2:hover .enter-btn {
      box-shadow: 0 4px 20px rgba(51, 204, 255, 0.5);
      filter: brightness(1.1);
    }
    
    footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @media (max-width: 650px) {
      .cards-row {
        grid-template-columns: 1fr;
      }
      .landing-container {
        padding: 15px;
        gap: 20px;
      }
      html, body {
        overflow-y: auto;
        height: auto;
        padding: 20px 0;
      }
    }
  </style>
</head>
<body>
  
  <canvas id="bg-canvas"></canvas>
  
  <div class="landing-container">
    <div class="brand-section">
      <i class="fa-solid fa-satellite-dish brand-icon"></i>
      <h1 class="title-neon">Secret Mission War</h1>
      <p class="subtitle">서버리스 워크숍 오토 스케줄 작전 통제 본부</p>
    </div>
    
    <div class="cards-row">
      <!-- TEAM 1 CARD -->
      <div class="glass-panel team-card t1" onclick="navigateTo('team1')">
        <i class="fa-solid fa-rocket card-icon"></i>
        <h2 class="card-title">1조 작전 지휘소</h2>
        <div class="member-badge"><i class="fa-solid fa-user-group"></i> 요원 10명 편성됨</div>
        <p class="card-desc">1조의 합동 작전 미션 편성 및 개별 요원 기습 지령을 동적 제어하고 발송 스케줄을 빌드합니다.</p>
        <button class="enter-btn">
          <span>진입하기</span> <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </div>
      
      <!-- TEAM 2 CARD -->
      <div class="glass-panel team-card t2" onclick="navigateTo('team2')">
        <i class="fa-solid fa-shield-halved card-icon"></i>
        <h2 class="card-title">2조 작전 지휘소</h2>
        <div class="member-badge"><i class="fa-solid fa-user-group"></i> 요원 12명 편성됨</div>
        <p class="card-desc">2조의 합동 작전 미션 편성 및 개별 요원 기습 지령을 동적 제어하고 발송 스케줄을 빌드합니다.</p>
        <button class="enter-btn">
          <span>진입하기</span> <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </div>
    </div>
    
    <footer>
      <p>&copy; 2026 Project Secret Card Commander. Serverless GitHub Actions Integration.</p>
    </footer>
  </div>

  <script>
    function navigateTo(team) {
      window.location.href = team + '.html';
    }
    
    // Background canvas animation
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 25;
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    class Particle {
      constructor() {
        this.reset();
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() * 0.2 - 0.1;
        this.speedY = Math.random() * 0.2 - 0.1;
        this.alpha = Math.random() * 0.4 + 0.1;
        this.color = Math.random() > 0.5 ? 'rgba(255, 51, 102, ' : 'rgba(51, 204, 255, ';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }
      draw() {
        ctx.fillStyle = this.color + this.alpha + ')';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
