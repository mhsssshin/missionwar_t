name: Secret Mission War Scheduler

on:
  schedule:
    # Run every 5 minutes to check for missions to send
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger for testing

permissions:
  contents: write

env:
  TZ: Asia/Seoul

jobs:
  check-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GHP }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run mission scheduler
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Seoul
        run: node scripts/check_and_send.js

      - name: Commit and push schedule updates
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain schedule.json)" ]; then
            git add schedule.json
            git commit -m "🤖 auto: mark sent missions [skip ci]"
            
            # Retry push up to 3 times in case of concurrent updates
            for i in 1 2 3; do
              if git push; then
                echo "✅ Push successful on attempt $i"
                break
              else
                echo "⚠️ Push failed on attempt $i, pulling and retrying..."
                git pull --rebase origin main
              fi
            done
          else
            echo "ℹ️ No schedule changes to commit."
          fi
